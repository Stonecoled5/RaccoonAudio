# Builds the app and attaches it to a release when a version tag (v0.1.1) is pushed.
# The executable is unsigned: Windows shows its "Windows protected your PC" warning the first time it's run.
#
# The app's own Update button installs what this publishes, so the names matter: the tag is v and three numbers, the
# zip is RaccoonAudio-win-x64.zip with RaccoonAudio.exe at its top. The app checks the zip against the checksum
# GitHub works out for it; the .sha256 file is the same checksum for people to check by hand, and what the app
# falls back on if GitHub's isn't there.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Build one self-contained file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/RaccoonAudio -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o publish
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item README.md publish/
          Compress-Archive -Path publish/* -DestinationPath RaccoonAudio-win-x64.zip
          $hash = (Get-FileHash RaccoonAudio-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("RaccoonAudio-win-x64.zip.sha256", "$hash  RaccoonAudio-win-x64.zip`n")
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" RaccoonAudio-win-x64.zip RaccoonAudio-win-x64.zip.sha256 --title "Raccoon Audio ${{ github.ref_name }}" --generate-notes
