# Builds the app and attaches it to a release when a version tag (v0.1.0) is pushed.
# The executable is unsigned: Windows shows its "Windows protected your PC" warning the first time it's run.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Build one self-contained file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/RaccoonAudio -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$version -o publish
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item README.md publish/
          Compress-Archive -Path publish/* -DestinationPath RaccoonAudio-win-x64.zip
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" RaccoonAudio-win-x64.zip --title "Raccoon Audio ${{ github.ref_name }}" --generate-notes
